name: Refresh GitHub metadata

# Weekly: update stars, license and last push for every listed hook.
#
# Order matters. A push made with the built-in GITHUB_TOKEN does not trigger
# the CI workflow, so this job validates the new data itself (tests + build)
# BEFORE committing it. If the refresh reports a problem (a repository was
# archived, disappeared, or the API was rate limited), good data is still
# committed, and the job then fails so someone looks at it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The refresh script validates entries with the site's own zod schema.
      - run: npm ci

      - name: Refresh data/github-meta.json
        id: refresh
        continue-on-error: true
        run: node scripts/refresh-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate the new data before committing it
        run: |
          npm test
          npm run build

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain data/github-meta.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/github-meta.json
            git commit -m "Refresh GitHub metadata"
            git push
          fi

      - name: Fail if the refresh reported problems
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::The refresh reported problems (archived or missing repos, rate limit). See the 'Refresh data/github-meta.json' step."
          exit 1
