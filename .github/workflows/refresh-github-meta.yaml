name: Refresh GitHub metadata

# Weekly: update stars, license and last push for every listed hook, and fail
# if a repository disappeared or was archived so someone looks at it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh data/github-meta.json
        run: node scripts/refresh-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/github-meta.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/github-meta.json
            git commit -m "Refresh GitHub metadata"
            git push
          fi
